{% extends "base.html" %}
{% load i18n %}

{% block title %}Регистрация - Форум{% endblock %}


{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <h1>Регистрация</h1>
        <form method="post" action="{% url 'users:signup' %}">
            {% csrf_token %}
            {% include "includes/form.html" with form=form submit_text="Зарегистрироваться" %}
        </form>
        <div class="auth-links">
            <p>Уже есть аккаунт? <a href="{% url 'users:login' %}">Войдите</a></p>
        </div>
    </div>
</div>
{% endblock content %}
