{% extends "base.html" %}
{% load i18n %}


{% block content %}
<h1>{% trans "Список пользователей" %}</h1>
{% for user in users %}
<a href={% url "users:user-detail" user.id %}>
<p>
<div class="card">
	<div class="card-body">
		{{ user.username }}
	</div>
</div>
</p>
</a>

{% empty %}
<li>{% trans "Нет активных пользователей." %}</li>
{% endfor %}
{% endblock %}
