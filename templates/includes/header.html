<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <a href="{% url 'homepage:home' %}">
                    <i class="fas fa-comments"></i>
                    Форум
                </a>
            </div>
            <!-- Форма поиска -->
            <div class="search-container">
                <form method="get" action="{% url 'homepage:home' %}" class="search-form">
                    <div class="search-group">
                        <input type="search"
                               name="q"
                               class="form-control search-input"
                               placeholder="Поиск постов..."
                               aria-label="Search"
                               value="{{ request.GET.q|default:'' }}">
                        <button class="btn search-btn" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>
            </div>
            <nav class="nav">
                <a href="{% url 'homepage:home' %}" class="nav-link">
                    <i class="fas fa-home"></i> Главная
                </a>
                {% if user.is_authenticated %}
                <a href="{% url 'posts:post-create' %}" class="nav-link">
                    <i class="fas fa-plus"></i> Создать пост
                </a>
                <a href="{% url 'users:profile' %}" class="nav-link">
                    <i class="fas fa-user"></i> {{ user.username }}
                </a>
                <form action="{% url 'users:logout' %}" method="post" class="nav-form">
                    {% csrf_token %}
                    <button type="submit" class="nav-link nav-btn">
                        <i class="fas fa-sign-out-alt"></i> Выйти
                    </button>
                </form>
                {% else %}
                <a href="{% url 'users:login' %}" class="nav-link">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </a>
                <a href="{% url 'users:signup' %}" class="nav-link">
                    <i class="fas fa-user-plus"></i> Регистрация
                </a>
                {% endif %}
            </nav>
        </div>
    </div>
</header>
